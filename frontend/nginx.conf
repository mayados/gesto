# Configuration nginx de Gesto.
# nginx sert les pages statiques ET fait office de passerelle vers les services.
# Il ne garde aucun état : pour savoir si un visiteur est connecté, il demande à accounts.

# Résolveur DNS interne de Docker : les adresses des services (accounts, projects, tasks)
# sont résolues à chaque requête, pas une seule fois au démarrage. Ainsi nginx démarre
# même si projects ou tasks ne sont pas (encore) lancés.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirections avec un chemin relatif (sans http://hote:port devant).
    absolute_redirect off;
    # Ne pas annoncer la version de nginx.
    server_tokens off;
    # Les requêtes de l'API sont petites (accounts refuse déjà plus de 10 ko).
    client_max_body_size 16k;

    # En-têtes de sécurité envoyés avec chaque réponse.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Adresses des services (variables : voir le résolveur plus haut).
    set $accounts_upstream accounts:3000;
    set $projects_upstream projects:8001;
    set $tasks_upstream    tasks:8002;

    # ------------------------------------------------------------------
    # Vérification de la session
    # ------------------------------------------------------------------
    # Location INTERNE : un client ne peut jamais l'appeler directement.
    # nginx l'appelle lui-même (auth_request) avant les routes protégées.
    location = /_verify {
        internal;
        proxy_pass http://$accounts_upstream/api/auth/verify;
        proxy_pass_request_body off;       # inutile pour une simple vérification
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;   # le cookie gesto_token
    }

    # ------------------------------------------------------------------
    # Pages publiques
    # ------------------------------------------------------------------
    location = / {
        try_files /index.html =404;
    }

    location = /login {
        try_files /login/index.html =404;
    }

    # Fichiers communs (styles, scripts, images) : publics.
    # Les pages de /login en ont besoin avant la connexion.
    location ~ ^/(assets|styles|js|images)/ {
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Pages réservées aux utilisateurs connectés
    # ------------------------------------------------------------------
    location = /app   { return 302 /app/; }
    location = /admin { return 302 /admin/; }

    location /app/ {
        auth_request /_verify;
        error_page 401 = @to_login;        # pas connecté : retour à la page de connexion
        try_files $uri $uri/index.html =404;
    }

    location /admin/ {
        auth_request /_verify;
        error_page 401 = @to_login;
        try_files $uri $uri/index.html =404;
    }

    location @to_login {
        return 302 /login;
    }

    # ------------------------------------------------------------------
    # API : accounts (routes publiques)
    # ------------------------------------------------------------------
    # Seules ces deux routes sont accessibles sans être connecté.
    location ~ ^/api/auth/(register|login)$ {
        include /etc/nginx/gesto_proxy_headers.conf;
        proxy_set_header X-User-Id   "";   # accounts n'en a pas besoin : on vide ce que le client envoie
        proxy_set_header X-User-Role "";
        proxy_pass http://$accounts_upstream;
    }

    # ------------------------------------------------------------------
    # API : accounts (routes protégées)
    # accounts lit lui-même le cookie, c'est lui qui a émis le jeton.
    # ------------------------------------------------------------------
    location = /api/auth/logout {
        include /etc/nginx/gesto_proxy_headers.conf;
        proxy_set_header X-User-Id   "";   # accounts n'en a pas besoin : on vide ce que le client envoie
        proxy_set_header X-User-Role "";
        proxy_pass http://$accounts_upstream;
    }

    location /api/users {
        include /etc/nginx/gesto_proxy_headers.conf;
        proxy_set_header X-User-Id   "";   # accounts n'en a pas besoin : on vide ce que le client envoie
        proxy_set_header X-User-Role "";
        proxy_pass http://$accounts_upstream;
    }

    # ------------------------------------------------------------------
    # API : projects et tasks (routes protégées par nginx)
    # ------------------------------------------------------------------
    location /api/projects {
        auth_request /_verify;
        error_page 401 = @api_401;
        # On récupère les en-têtes renvoyés par accounts...
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        include /etc/nginx/gesto_proxy_headers.conf;
        # ...et on les transmet au service. Ceux envoyés par le client sont écrasés.
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_pass http://$projects_upstream;
    }

    location /api/tasks {
        auth_request /_verify;
        error_page 401 = @api_401;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        include /etc/nginx/gesto_proxy_headers.conf;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_pass http://$tasks_upstream;
    }

    location @api_401 {
        default_type application/json;
        return 401 '{"error":"Non connecté"}';
    }

    # ------------------------------------------------------------------
    # Tout le reste est refusé
    # ------------------------------------------------------------------
    # Routes internes et santé des services : jamais exposées.
    location ~ ^/(internal|health)(/|$) {
        return 404;
    }

    # Y compris /api/auth/verify et tout chemin inconnu.
    location / {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
